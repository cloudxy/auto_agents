# 提交前自动质量门禁 - 对齐 CI 四阶段管道
#
# 安装：uv run pre-commit install
# 手动触发：uv run pre-commit run --all-files
#
# 设计说明：
# - 使用 local + system 语言，复用仓库内工具和脚本，
#   保证本地提交与 CI 使用同一份检查逻辑（单一事实来源）
# - check-arch.sh 退出码 = 违规数，非 0 即阻断提交
# - ruff 仅检查暂存的 Python 文件（快速反馈）
# - pytest 运行完整 backend/tests 套件（与 CI 对齐）
# - default_stages 锁定门禁在提交/推送阶段，避免在 post-checkout 等阶段误跑

default_stages: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: Ruff Lint（Python 代码检查）
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
        require_serial: true

      - id: pytest
        name: Pytest（后端测试套件）
        entry: env PYTHONDONTWRITEBYTECODE=1 uv run pytest -x -q backend/tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: check-arch
        name: 架构合规检查（R1–R13 + B1–B4）
        entry: bash tools/check/arch.sh
        language: system
        pass_filenames: false
        always_run: true

      # D 线 D2：数据库设计流水线执法（*.dbml 或 alembic/versions 变更时触发）
      - id: check-db-ir
        name: DBML IR 静态 lint（ADR-0002）
        entry: bash tools/check/db_ir.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: check-db-migrations
        name: 迁移破坏性变更检测（strong_migrations 语义）
        entry: bash tools/check/db_migrations.sh
        language: system
        pass_filenames: false
        always_run: true

      # 工单 68：前端工程门禁（规则随批次启用，当前 F-5/F-6）
      - id: check-frontend
        name: 前端工程门禁（F-5 互引禁令 / F-6 Envelope 单源）
        entry: bash tools/check/frontend.sh
        language: system
        pass_filenames: false
        always_run: true

      # 分支切换后自动同步 main（fail-open，冲突时回滚并提示手动处理）
      - id: sync-main
        name: Sync Main（切换分支自动合并 main）
        entry: bash tools/git/sync_main.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-checkout]
