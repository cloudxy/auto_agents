# API 服务配置

API:
  # 服务器配置
  HOST: "127.0.0.1"
  PORT: 9111
  
  # 调试模式
  DEBUG: false

  # 反向代理信任头（uvicorn proxy_headers / forwarded_allow_ips）
  # 仅信任 FORWARDED_ALLOW_IPS 列表内反代写入的 X-Forwarded-For
  # ⚠️ 过宽（如 "*" 或未收紧的网段）会允许客户端伪造 XFF 绕过按 IP 限流，
  #    接入反代后必须收紧为自家反代出口 IP；默认仅信任本机
  PROXY_HEADERS: true
  FORWARDED_ALLOW_IPS: "127.0.0.1"
  
  # 注意：API 路由前缀由代码控制
  # - 主路由: /api (在 backend/app/__init__.py 中定义)
  # - 版本路由: /v1, /v2 (在 backend/app/api/__init__.py 中定义)
  # - 最终路径: /api/v1/*, /api/v2/*
  
  # 注意：密钥配置在 jwt.yml 中

# 公开数据 API 配置（第三方系统拉取采集结果）
# 鉴权统一入口：backend/app/external_api/v1/webhooks.py validate_api_key
# 推荐使用新键 EXTERNAL_API.API_KEYS（config/default/external_api.yml）；
# 下方旧单 key 仅作过渡期兼容（非空时并入有效密钥列表），迁移后可移除。
# 环境变量覆盖: AUTO_AGENTS_EXTERNAL_API__API_KEY="your-key"（deprecated）
EXTERNAL_API:
  API_KEY: ""  # deprecated（过渡期兼容旧部署）：非空并入有效密钥；新部署请配 EXTERNAL_API.API_KEYS
