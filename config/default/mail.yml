# 邮件发送（决策 D25：对外联系、到期提醒、注册邮箱验证都走邮箱）
# 账号口令只从环境变量读：MAIL_USERNAME / MAIL_PASSWORD（不入库、不进 yml）
MAIL:
  ENABLED: false                    # 未启用时写进本地发件箱（OUTBOX_DIR），开发流程照常走通
  HOST: ""
  PORT: 465
  USE_SSL: true                     # 465 = SSL；587 设 false 走 STARTTLS
  FROM: "AutoAgents <no-reply@example.com>"
  TIMEOUT_SECONDS: 10
  OUTBOX_DIR: "runtime/mail_outbox"
