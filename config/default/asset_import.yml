# 能力资产导入通道（FR-100 / ADR-0023）——沙箱与上传上限（NFR-10 配置即代码）
# 与 backend/config_consts.py 的 ASSET_IMPORT_* 常量保持一致（常量是调用点兜底）。
ASSET_IMPORT:
  # 单条目大小上限（字节）——超过的条目拒绝且原因含上限数字（GWT-100.5）
  MAX_FILE_BYTES: 10485760
  # 批总量上限（字节）：上传总量 + 解包累计量（压缩炸弹防线，整批失败）
  MAX_BATCH_BYTES: 52428800
  # 条目数上限（同步解析耗时防护；无后台任务）
  MAX_ENTRIES: 200
  # 沙箱根目录；空 = 系统 tempfile 默认（导入结束即清理）
  SANDBOX_ROOT: ""
