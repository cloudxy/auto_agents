# 平台 LLM 网关（LiteLLM Proxy）HTTP 连接。backend 只持虚拟 Key，禁止直连网关库。
#
# 嵌套读取：
#   settings.get("LITELLM.BASE_URL")
# 环境变量覆盖（Dynaconf 双下划线嵌套，前缀 AUTO_AGENTS_）：
#   AUTO_AGENTS_LITELLM__BASE_URL=http://127.0.0.1:4000
#   AUTO_AGENTS_LITELLM__TIMEOUT=60
#   AUTO_AGENTS_LITELLM__MASTER_KEY=   # 敏感，只走 config/<env>/.env
#
# MASTER_KEY 为网关虚拟 Key（或操作者签发的等价 Key），不落本 yml。
# 上游供应商 Key 只活在 LiteLLM 密钥面。compose 见 deploy/litellm/。
LITELLM:
  BASE_URL: "http://127.0.0.1:4000"  # 同机 Proxy；容器加入 litellm-net 后用 http://litellm:4000
  TIMEOUT: 60                        # 单次 HTTP 超时（秒）
