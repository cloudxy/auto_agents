# 生产环境 LLM 覆盖（叠加 default/llm.yml）
LLM:
  # 10.2-D 审计定案：prod 预算熔断 fail-closed——Redis 读数不可用即拒绝 LLM 调用
  # （保成本；与登录限流 fail-open 方向相反，属刻意不对称，见 llm_client 预算段 docstring）
  BUDGET_FAIL_CLOSED: true
  # 审计 P0-8：prod 恒拦私网 base_url（代码侧 APP_ENV=prod 时同样强制，此处显式声明便于审阅）；
  # 确需接自建内网模型服务时，把主机名加入 PROVIDER_PRIVATE_HOSTS_ALLOWED
  PROVIDER_BLOCK_PRIVATE_URL: true
  PROVIDER_PRIVATE_HOSTS_ALLOWED: []
