# ============================================================
# New API 多租户中转站 - 生产部署（new-api + MySQL 8 + Redis 7）
# ------------------------------------------------------------
# 定位：独立隔离部署（独立目录 / 独立网络 newapi-net），
#       不并入项目根 docker-compose.yml，不进 uv workspace。
#
# 使用方式：
#   1. cp .env.example .env 并逐项修改密钥/密码（见 .env 醒目提示）
#   2. docker compose up -d
#   3. 浏览器打开 http://<host>:3000，初始账号 root / 123456，
#      登录后【立即修改管理员密码】
#
# 版本锁定说明（禁止回退 :latest / 候选版）：
#   - new-api  v0.10.7    2026-02 发布，v0.x 正式稳定线最新版；
#                         v1.0.0 尚处 RC 阶段（rc.27）未转正，不用于生产；
#                         镜像由上游 CI 按 git tag 构建：calciumion/new-api:<tag>
#                         （如需更保守可改 v0.8 线末版 v0.8.9.3.1，2025-08 发布）
#   - mysql    8.0        锁定 8.0.x 版本线（任务约定）；如需固定补丁版本，
#                         查询 Docker Hub 后改为具体 8.0.x；8.0 EOL 2026-10，
#                         后续可评估迁移 8.4 LTS
#   - redis    7.4-alpine 锁定 7.x 线内的 7.4
#
# 端口：仅对外发布 3000（NEWAPI_BIND / NEWAPI_PORT 可调，见 .env.example）；
#       MySQL / Redis 不发布任何宿主端口。
# 网络：独立 bridge 网络 newapi-net。未来调度器若容器化，加入本网络即可
#       通过服务名（new-api / mysql / redis）互通，禁止写死 127.0.0.1。
# 调度与探针：渠道调度器、渠道真伪探针不由本目录承载，由本项目 backend
#       内置服务实现（config/default/newapi.yml，默认关闭），详见 README §5。
# ============================================================

services:
  new-api:
    image: calciumion/new-api:v0.10.7      # 锁定版本；勿用 :latest（漂移）与 v1.0.0-rc（非稳定）
    container_name: newapi-app
    restart: unless-stopped
    ports:
      # 默认全接口发布 3000；生产建议 .env 中改 NEWAPI_BIND=127.0.0.1，
      # 由同机 Caddy/Nginx 反代对外提供 HTTPS（见 README §4）
      - "${NEWAPI_BIND:-0.0.0.0}:${NEWAPI_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # --- 数据库（MySQL；DSN 由 .env 中 MYSQL_* 拼装，单处维护防漂移）---
      - SQL_DSN=${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=True&loc=Local
      # --- 缓存（Redis：令牌缓存 / 并发与限流）---
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD}@redis:6379
      # --- 安全密钥（必填，openssl rand -hex 32 生成；缺失时 compose 直接报错拒绝启动）---
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - CRYPTO_SECRET=${CRYPTO_SECRET:?CRYPTO_SECRET is required}
      # --- HTTPS 反代就绪后保持 true（.env.example 默认 true）；
      #     纯 HTTP 直连试跑必须改 false，否则浏览器不回传会话 Cookie ---
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - SESSION_COOKIE_TRUSTED_URL=${SESSION_COOKIE_TRUSTED_URL:-}
      # --- 日志级别 ---
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./data:/data                     # 备用数据目录（生产主数据在 MySQL）
    healthcheck:                         # 上游镜像为 alpine 基础，自带 busybox wget
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  mysql:
    image: mysql:8.0                     # 锁定 8.0 版本线（任务约定 8.0.x）
    container_name: newapi-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-newapi}
      # 独立业务账号（最小权限，仅授予 MYSQL_DATABASE 库）；
      # 注意 MySQL 镜像约束：MYSQL_USER 不能叫 root
      - MYSQL_USER=${MYSQL_USER:-newapi}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:                         # 密码经容器内 env 读取（$$ 转义，避免明文进命令行）
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  redis:
    image: redis:7.4-alpine              # 锁定 7.x 线内的 7.4
    container_name: newapi-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD} # 仅供容器内 healthcheck 使用（$$ 转义读取）
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  default:
    name: newapi-net
