    - id: D-1
      where: backend/services/product_event_service.py
      what: >
        事务内发射的产品事件在单写库上被永久丢弃。_persist_event 刻意开第二连接提交事件，
        而调用方 flush 后持库级写锁 → SQLite 必 `database is locked`，等满 connect_args
        timeout=30s 后抛错被 emit_product_event 的 try/except 吞掉。本仓库 CI 主 pytest job
        正是 SQLite（MYSQL_FIDELITY 只在单独 fidelity job 开），故 sync_completed/
        import_completed 在 CI 口径下 100% 丢，GWT-08.1/08.3 可检索断言永远不可能通过。
      fix: 独立会话被 OperationalError 挡住则退回主会话追加；SQLite 侧先 PRAGMA busy_timeout=250 不做长等。
      impact: test_sync_endpoint 单用例 33.8s → 全套三文件 15 用例 10.35s；事件不再丢。
    - id: D-2
      where: backend/app/api/v1/public_skills.py
      what: detail_opened 写成了 preview/正式二选一，租户侧不发——与 AD-5e「preview 与正式均发」相悖，GWT-08.4 租户分支覆盖不到。
      fix: 两条通道都追发 detail_opened；MARKET_DETAIL_VIEWED 原样保留。
    - id: D-3
      where: frontend/admin/src/pages/market/CatalogTab.test.tsx（+ CatalogTab.tsx aria-label）
      what: 上一会话中断时刚写完未跑，11 用例全红（缺 QueryClientProvider / antd 两字按钮插空格与图标 aria-label 污染可及名 / 一行写废的三元）。
      fix: 见 03-impl/T-11-T-15-frontend-fix-evidence.md；现 11/11 绿。
    - id: D-5
      where: frontend/admin/src/frU24CopyScan.test.tsx
      what: >
        T-08 给 TenantShelf 接了 usePermission（内部 `useAuthStore()` 不带 selector），
        而该机械钉用例的 useAuthStore mock 只支持带 selector 的调用形态 → 渲染即
        `TypeError: sel is not a function`，上一会话遗留的红。
      fix: mock 改为两种调用形态都支持（与 zustand 真实 API 一致），并补 isAuthenticated。
    - id: D-4
      where: backend/services/power_market/service.py
      what: WIP 把 _project 搬到 projection.py 后留下两处 F401（hosts_for_asset / _to_public_asset_type），ruff 红。
      fix: ruff --fix；顺带为 AD-11 行数预算腾出 2 行。
